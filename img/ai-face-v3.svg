<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 640" style="background:#050810;">
  <defs>
    <filter id="glow-sm-v3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-md-v3" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-lg-v3" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#12c2e9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#12c2e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core-glow-2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12c2e9" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#12c2e9" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Dark bg -->
  <rect width="420" height="640" fill="#050810"/>

  <!-- Ambient background glows -->
  <ellipse cx="210" cy="300" rx="200" ry="230" fill="url(#core-glow-2)" opacity="0.6"/>
  <ellipse cx="210" cy="280" rx="150" ry="180" fill="url(#core-glow)" opacity="0.5"/>

  <!-- ══════════════════════════
       NEURAL FACE — abstract orbital
       ══════════════════════════ -->

  <!-- Outer orbit ring -->
  <ellipse cx="210" cy="300" rx="175" ry="210" fill="none" stroke="#12c2e9" stroke-width="0.5" stroke-dasharray="4,8" opacity="0.25">
    <animateTransform attributeName="transform" type="rotate" values="0 210 300;360 210 300" dur="40s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Middle orbit ring -->
  <ellipse cx="210" cy="295" rx="135" ry="165" fill="none" stroke="#7c3aed" stroke-width="0.5" stroke-dasharray="3,12" opacity="0.2">
    <animateTransform attributeName="transform" type="rotate" values="360 210 295;0 210 295" dur="28s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Inner orbit ring -->
  <ellipse cx="210" cy="295" rx="95" ry="118" fill="none" stroke="#12c2e9" stroke-width="0.6" stroke-dasharray="2,6" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" values="0 210 295;360 210 295" dur="18s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ══════════════════════════
       FACE SKELETON — geometric planes
       ══════════════════════════ -->

  <!-- Cranium top arc -->
  <path d="M 148,128 C 160,98 182,82 210,80 C 238,82 260,98 272,128" fill="none" stroke="#12c2e9" stroke-width="1.2" opacity="0.5" filter="url(#glow-sm-v3)"/>

  <!-- Face outline — angular hexagonal-ish -->
  <path d="M 148,128 L 122,195 L 118,252 L 130,308 L 158,355 L 210,380 L 262,355 L 290,308 L 302,252 L 298,195 L 272,128 Z"
    fill="none" stroke="url(#ring-grad)" stroke-width="1" opacity="0.35"/>

  <!-- Face fill (subtle) -->
  <path d="M 148,128 L 122,195 L 118,252 L 130,308 L 158,355 L 210,380 L 262,355 L 290,308 L 302,252 L 298,195 L 272,128 Z"
    fill="#070d1e" opacity="0.6"/>

  <!-- Forehead plane divisions -->
  <line x1="210" y1="80" x2="210" y2="420" stroke="#12c2e9" stroke-width="0.4" opacity="0.12"/>
  <line x1="118" y1="252" x2="302" y2="252" stroke="#12c2e9" stroke-width="0.4" opacity="0.1"/>
  <line x1="122" y1="195" x2="298" y2="195" stroke="#12c2e9" stroke-width="0.4" opacity="0.1"/>
  <line x1="130" y1="308" x2="290" y2="308" stroke="#12c2e9" stroke-width="0.4" opacity="0.1"/>

  <!-- Cheekbone planes -->
  <line x1="148" y1="128" x2="122" y2="195" stroke="#12c2e9" stroke-width="0.8" opacity="0.25"/>
  <line x1="272" y1="128" x2="298" y2="195" stroke="#12c2e9" stroke-width="0.8" opacity="0.25"/>
  <line x1="122" y1="195" x2="118" y2="252" stroke="#12c2e9" stroke-width="0.8" opacity="0.2"/>
  <line x1="298" y1="195" x2="302" y2="252" stroke="#12c2e9" stroke-width="0.8" opacity="0.2"/>

  <!-- ══════════════════════════
       EYES — neural cluster style
       ══════════════════════════ -->

  <!-- Left eye region -->
  <ellipse cx="165" cy="205" rx="28" ry="16" fill="#070e20" stroke="#12c2e9" stroke-width="0.8" opacity="0.6" filter="url(#glow-sm-v3)"/>
  <!-- Left iris ring -->
  <circle cx="165" cy="205" r="11" fill="none" stroke="#12c2e9" stroke-width="1" opacity="0.7" filter="url(#glow-sm-v3)"/>
  <circle cx="165" cy="205" r="7" fill="none" stroke="#7c3aed" stroke-width="0.8" opacity="0.5"/>
  <!-- Left pupil -->
  <circle cx="165" cy="205" r="4" fill="#12c2e9" opacity="0.95" filter="url(#glow-md-v3)">
    <animate attributeName="opacity" values="0.95;0.3;0.95" dur="3.4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;3.2;4" dur="3.4s" repeatCount="indefinite"/>
  </circle>
  <!-- Left eye glint -->
  <circle cx="168" cy="202" r="1.5" fill="#fff" opacity="0.6"/>
  <!-- Left eye scan lines -->
  <line x1="140" y1="205" x2="154" y2="205" stroke="#12c2e9" stroke-width="0.6" opacity="0.4"/>
  <line x1="176" y1="205" x2="192" y2="205" stroke="#12c2e9" stroke-width="0.6" opacity="0.4"/>

  <!-- Right eye region -->
  <ellipse cx="255" cy="205" rx="28" ry="16" fill="#070e20" stroke="#12c2e9" stroke-width="0.8" opacity="0.6" filter="url(#glow-sm-v3)"/>
  <!-- Right iris ring -->
  <circle cx="255" cy="205" r="11" fill="none" stroke="#12c2e9" stroke-width="1" opacity="0.7" filter="url(#glow-sm-v3)"/>
  <circle cx="255" cy="205" r="7" fill="none" stroke="#7c3aed" stroke-width="0.8" opacity="0.5"/>
  <!-- Right pupil -->
  <circle cx="255" cy="205" r="4" fill="#12c2e9" opacity="0.95" filter="url(#glow-md-v3)">
    <animate attributeName="opacity" values="0.95;0.3;0.95" dur="3.4s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;3.2;4" dur="3.4s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <!-- Right eye glint -->
  <circle cx="258" cy="202" r="1.5" fill="#fff" opacity="0.6"/>
  <!-- Right eye scan lines -->
  <line x1="228" y1="205" x2="244" y2="205" stroke="#12c2e9" stroke-width="0.6" opacity="0.4"/>
  <line x1="266" y1="205" x2="282" y2="205" stroke="#12c2e9" stroke-width="0.6" opacity="0.4"/>

  <!-- ══════════════════════════
       NOSE BRIDGE — triangular data node
       ══════════════════════════ -->
  <path d="M 210,222 L 196,272 L 210,280 L 224,272 Z" fill="none" stroke="#12c2e9" stroke-width="0.8" opacity="0.35"/>
  <circle cx="210" cy="280" r="3" fill="#12c2e9" opacity="0.5" filter="url(#glow-sm-v3)">
    <animate attributeName="opacity" values="0.5;0.15;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ══════════════════════════
       MOUTH — data stream
       ══════════════════════════ -->
  <path d="M 175,338 C 188,348 222,350 245,338" fill="none" stroke="#12c2e9" stroke-width="1" opacity="0.45" filter="url(#glow-sm-v3)"/>
  <!-- Mouth data dots -->
  <circle cx="185" cy="344" r="1.5" fill="#12c2e9" opacity="0.4"/>
  <circle cx="198" cy="348" r="1.5" fill="#12c2e9" opacity="0.4"/>
  <circle cx="210" cy="349" r="1.5" fill="#12c2e9" opacity="0.4"/>
  <circle cx="222" cy="347" r="1.5" fill="#12c2e9" opacity="0.4"/>
  <circle cx="235" cy="342" r="1.5" fill="#12c2e9" opacity="0.4"/>

  <!-- ══════════════════════════
       NEURAL NETWORK — distributed nodes
       ══════════════════════════ -->

  <!-- Connection lines (behind nodes) -->
  <g stroke="#12c2e9" fill="none" opacity="0.18">
    <!-- Scalp to outer nodes -->
    <line x1="210" y1="80" x2="60" y2="30"/>
    <line x1="210" y1="80" x2="360" y2="30"/>
    <line x1="210" y1="80" x2="210" y2="20"/>
    <line x1="165" y1="92" x2="60" y2="30"/>
    <line x1="255" y1="92" x2="360" y2="30"/>
    <!-- Side temple connections -->
    <line x1="122" y1="195" x2="30" y2="155"/>
    <line x1="122" y1="195" x2="30" y2="230"/>
    <line x1="118" y1="252" x2="30" y2="290"/>
    <line x1="298" y1="195" x2="390" y2="155"/>
    <line x1="298" y1="195" x2="390" y2="230"/>
    <line x1="302" y1="252" x2="390" y2="290"/>
    <!-- Lower connections -->
    <line x1="130" y1="308" x2="30" y2="340"/>
    <line x1="290" y1="308" x2="390" y2="340"/>
    <line x1="158" y1="355" x2="80" y2="410"/>
    <line x1="262" y1="355" x2="340" y2="410"/>
    <!-- Cross connections -->
    <line x1="60" y1="30" x2="30" y2="155"/>
    <line x1="360" y1="30" x2="390" y2="155"/>
    <line x1="30" y1="155" x2="30" y2="230"/>
    <line x1="390" y1="155" x2="390" y2="230"/>
    <line x1="30" y1="230" x2="30" y2="290"/>
    <line x1="390" y1="230" x2="390" y2="290"/>
    <line x1="30" y1="290" x2="30" y2="340"/>
    <line x1="390" y1="290" x2="390" y2="340"/>
    <!-- Bottom cross-links -->
    <line x1="80" y1="410" x2="340" y2="410"/>
    <line x1="80" y1="410" x2="60" y2="500"/>
    <line x1="340" y1="410" x2="360" y2="500"/>
    <line x1="60" y1="500" x2="360" y2="500"/>
    <line x1="60" y1="500" x2="120" y2="580"/>
    <line x1="360" y1="500" x2="300" y2="580"/>
    <line x1="120" y1="580" x2="300" y2="580"/>
    <!-- Inner mesh -->
    <line x1="60" y1="30" x2="30" y2="230"/>
    <line x1="360" y1="30" x2="390" y2="230"/>
    <line x1="30" y1="155" x2="30" y2="340"/>
    <line x1="390" y1="155" x2="390" y2="340"/>
  </g>

  <!-- Purple cross-links (secondary network) -->
  <g stroke="#7c3aed" fill="none" opacity="0.12">
    <line x1="60" y1="30" x2="30" y2="290"/>
    <line x1="360" y1="30" x2="390" y2="290"/>
    <line x1="30" y1="155" x2="80" y2="410"/>
    <line x1="390" y1="155" x2="340" y2="410"/>
    <line x1="30" y1="230" x2="60" y2="500"/>
    <line x1="390" y1="230" x2="360" y2="500"/>
    <line x1="80" y1="410" x2="120" y2="580"/>
    <line x1="340" y1="410" x2="300" y2="580"/>
  </g>

  <!-- OUTER NODES — cyan -->
  <g filter="url(#glow-lg-v3)">
    <circle cx="210" cy="20" r="4" fill="#12c2e9"><animate attributeName="opacity" values="1;0.2;1" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="30" r="3.5" fill="#12c2e9"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="30" r="3.5" fill="#12c2e9"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="155" r="3" fill="#12c2e9"><animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="390" cy="155" r="3" fill="#12c2e9"><animate attributeName="opacity" values="0.8;0.15;0.8" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="230" r="3" fill="#12c2e9"><animate attributeName="opacity" values="1;0.25;1" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="390" cy="230" r="3" fill="#12c2e9"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="290" r="3" fill="#12c2e9"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.0s" repeatCount="indefinite"/></circle>
    <circle cx="390" cy="290" r="3" fill="#12c2e9"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="30" cy="340" r="3" fill="#12c2e9"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="390" cy="340" r="3" fill="#12c2e9"><animate attributeName="opacity" values="0.8;0.25;0.8" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="410" r="3.5" fill="#12c2e9"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="410" r="3.5" fill="#12c2e9"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="500" r="3" fill="#12c2e9"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="500" r="3" fill="#12c2e9"><animate attributeName="opacity" values="1;0.25;1" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="580" r="3" fill="#12c2e9"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="580" r="3" fill="#12c2e9"><animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.0s" repeatCount="indefinite"/></circle>
  </g>

  <!-- FACE VERTEX NODES — purple (larger) -->
  <g filter="url(#glow-lg-v3)">
    <circle cx="148" cy="128" r="5" fill="#8b5cf6"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="272" cy="128" r="5" fill="#8b5cf6"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="122" cy="195" r="5" fill="#7c3aed"><animate attributeName="opacity" values="1;0.25;1" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="298" cy="195" r="5" fill="#7c3aed"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="118" cy="252" r="4.5" fill="#8b5cf6"><animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="302" cy="252" r="4.5" fill="#8b5cf6"><animate attributeName="opacity" values="0.9;0.25;0.9" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="130" cy="308" r="5" fill="#7c3aed"><animate attributeName="opacity" values="1;0.3;1" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="308" r="5" fill="#7c3aed"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="158" cy="355" r="4.5" fill="#8b5cf6"><animate attributeName="opacity" values="1;0.25;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="262" cy="355" r="4.5" fill="#8b5cf6"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.0s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="380" r="5.5" fill="#7c3aed"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="80" r="5" fill="#8b5cf6"><animate attributeName="opacity" values="0.9;0.25;0.9" dur="2.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Floating data labels -->
  <text x="35" y="150" font-family="monospace" font-size="7" fill="#12c2e9" opacity="0.3" letter-spacing="1">SYS.01</text>
  <text x="345" y="150" font-family="monospace" font-size="7" fill="#12c2e9" opacity="0.3" letter-spacing="1">SYS.02</text>
  <text x="35" y="285" font-family="monospace" font-size="7" fill="#7c3aed" opacity="0.3" letter-spacing="1">0x3F</text>
  <text x="362" y="285" font-family="monospace" font-size="7" fill="#7c3aed" opacity="0.3" letter-spacing="1">0x4A</text>
  <text x="72" y="425" font-family="monospace" font-size="7" fill="#12c2e9" opacity="0.25" letter-spacing="1">NET.L</text>
  <text x="328" y="425" font-family="monospace" font-size="7" fill="#12c2e9" opacity="0.25" letter-spacing="1">NET.R</text>

  <!-- Traveling pulse on network — left side -->
  <circle cx="0" cy="0" r="3" fill="#12c2e9" opacity="0.9" filter="url(#glow-md-v3)">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 210,80 L 60,30 L 30,155 L 30,230 L 30,290 L 30,340 L 80,410 L 60,500"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.9;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Traveling pulse on network — right side -->
  <circle cx="0" cy="0" r="3" fill="#7c3aed" opacity="0.9" filter="url(#glow-md-v3)">
    <animateMotion dur="4.5s" begin="2s" repeatCount="indefinite" path="M 210,80 L 360,30 L 390,155 L 390,230 L 390,290 L 390,340 L 340,410 L 360,500"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.1;0.9;1" dur="4.5s" begin="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Neck data conduit -->
  <rect x="195" y="385" width="30" height="55" rx="4" fill="none" stroke="#12c2e9" stroke-width="0.6" opacity="0.25"/>
  <line x1="203" y1="385" x2="203" y2="440" stroke="#12c2e9" stroke-width="0.4" opacity="0.2"/>
  <line x1="210" y1="385" x2="210" y2="440" stroke="#12c2e9" stroke-width="0.4" opacity="0.15"/>
  <line x1="217" y1="385" x2="217" y2="440" stroke="#12c2e9" stroke-width="0.4" opacity="0.2"/>

  <!-- Shoulder suggestion -->
  <path d="M 148,440 C 130,445 95,460 60,500" fill="none" stroke="#12c2e9" stroke-width="0.8" opacity="0.2"/>
  <path d="M 272,440 C 290,445 325,460 360,500" fill="none" stroke="#12c2e9" stroke-width="0.8" opacity="0.2"/>

  <!-- Background particle field -->
  <g fill="#12c2e9" opacity="0.15">
    <circle cx="20" cy="80" r="1"/><circle cx="400" cy="100" r="1.2"/>
    <circle cx="10" cy="380" r="0.8"/><circle cx="410" cy="400" r="1"/>
    <circle cx="35" cy="560" r="1.2"/><circle cx="388" cy="540" r="0.8"/>
    <circle cx="200" cy="620" r="1"/><circle cx="220" cy="610" r="0.8"/>
  </g>
  <g fill="#8b5cf6" opacity="0.15">
    <circle cx="15" cy="200" r="1.2"/><circle cx="405" cy="180" r="1"/>
    <circle cx="25" cy="460" r="1"/><circle cx="398" cy="475" r="1.2"/>
    <circle cx="190" cy="15" r="1"/><circle cx="230" cy="10" r="1.2"/>
  </g>
</svg>
