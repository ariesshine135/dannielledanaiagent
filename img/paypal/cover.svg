  <text x="80" y="490" font-family="'Helvetica Neue',sans-serif" font-size="11" font-weight="300" letter-spacing="4" fill="rgba(255,255,255,0.35)" text-transform="uppercase">PAYPAL</text>
  <text x="80" y="510" font-family="'Helvetica Neue',sans-serif" font-size="9" letter-spacing="3" fill="rgba(255,255,255,0.2)">CUSTOMERS · 2020–2023</text>
