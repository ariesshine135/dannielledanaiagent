  <line x1="200" y1="0" x2="200" y2="540" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="540" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="540" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

