  <rect x="612" y="156" width="72" height="36" rx="18" fill="rgba(18,194,233,0.1)" stroke="rgba(18,194,233,0.25)" stroke-width="1"/>
  <text x="648" y="168" font-family="'Helvetica Neue',sans-serif" font-size="8" font-weight="700" fill="rgba(18,194,233,0.9)" text-anchor="middle">~$47B</text>
