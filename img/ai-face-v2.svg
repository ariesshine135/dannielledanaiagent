<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 640" style="background:#04060e;">
  <defs>
    <filter id="glow-sm-v2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-lg-v2" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bg-v2" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#071022"/>
      <stop offset="100%" stop-color="#040608"/>
    </radialGradient>
    <radialGradient id="face-fill-v2" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#0b1d38" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#040c1e" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="scan-line" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12c2e9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#12c2e9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#12c2e9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="420" height="640" fill="url(#bg-v2)"/>
  <!-- Center glow -->
  <ellipse cx="210" cy="260" rx="160" ry="200" fill="#0a1f40" opacity="0.4"/>
  <ellipse cx="210" cy="260" rx="80" ry="110" fill="#0d2548" opacity="0.35"/>

  <!-- FRONT-FACING GEOMETRIC FACE -->
  <!-- Head outer shape -->
  <ellipse cx="210" cy="220" rx="115" ry="138"
    fill="url(#face-fill-v2)"
    stroke="#12c2e9"
    stroke-width="1.4"
    filter="url(#glow-sm-v2)"
  />

  <!-- Jaw/chin -->
  <path d="M 140,300 C 148,355 170,390 210,400 C 250,390 272,355 280,300"
    fill="url(#face-fill-v2)"
    stroke="#12c2e9"
    stroke-width="1.4"
    filter="url(#glow-sm-v2)"
  />

  <!-- Neck -->
  <path d="M 185,395 L 180,440 L 240,440 L 235,395"
    fill="#050d1e"
    stroke="#12c2e9"
    stroke-width="1"
    opacity="0.6"
  />

  <!-- FACIAL GRID LINES — symmetry lines -->
  <!-- Vertical center -->
  <line x1="210" y1="85" x2="210" y2="440" stroke="#12c2e9" stroke-width="0.4" opacity="0.15"/>
  <!-- Horizontal eye line -->
  <line x1="90" y1="210" x2="330" y2="210" stroke="#12c2e9" stroke-width="0.4" opacity="0.12"/>
  <!-- Horizontal nose line -->
  <line x1="110" y1="280" x2="310" y2="280" stroke="#12c2e9" stroke-width="0.4" opacity="0.1"/>
  <!-- Horizontal mouth line -->
  <line x1="130" y1="338" x2="290" y2="338" stroke="#12c2e9" stroke-width="0.4" opacity="0.1"/>

  <!-- EYES -->
  <!-- Left eye -->
  <ellipse cx="165" cy="210" rx="26" ry="14"
    fill="#050d22"
    stroke="#12c2e9" stroke-width="1.2"
    filter="url(#glow-sm-v2)"
  />
  <circle cx="165" cy="210" r="9" fill="#07122a"/>
  <circle cx="165" cy="210" r="5" fill="#12c2e9" opacity="0.9" filter="url(#glow-sm-v2)">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="165" cy="210" r="2.5" fill="#fff" opacity="0.8"/>
  <circle cx="168" cy="207" r="1.2" fill="#fff" opacity="0.5"/>

  <!-- Right eye -->
  <ellipse cx="255" cy="210" rx="26" ry="14"
    fill="#050d22"
    stroke="#12c2e9" stroke-width="1.2"
    filter="url(#glow-sm-v2)"
  />
  <circle cx="255" cy="210" r="9" fill="#07122a"/>
  <circle cx="255" cy="210" r="5" fill="#12c2e9" opacity="0.9" filter="url(#glow-sm-v2)">
    <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="255" cy="210" r="2.5" fill="#fff" opacity="0.8"/>
  <circle cx="258" cy="207" r="1.2" fill="#fff" opacity="0.5"/>

  <!-- Eyebrows -->
  <path d="M 143,192 C 152,186 164,184 180,186" fill="none" stroke="#12c2e9" stroke-width="1.2" opacity="0.6" filter="url(#glow-sm-v2)"/>
  <path d="M 277,192 C 268,186 256,184 240,186" fill="none" stroke="#12c2e9" stroke-width="1.2" opacity="0.6" filter="url(#glow-sm-v2)"/>

  <!-- NOSE — geometric -->
  <path d="M 210,228 L 195,275 L 210,282 L 225,275 Z"
    fill="none" stroke="#12c2e9" stroke-width="0.9" opacity="0.45" filter="url(#glow-sm-v2)"/>

  <!-- MOUTH -->
  <path d="M 178,340 C 190,350 220,352 242,340" fill="none" stroke="#12c2e9" stroke-width="1.2" opacity="0.55" filter="url(#glow-sm-v2)"/>
  <path d="M 185,338 C 198,333 222,333 235,338" fill="none" stroke="#12c2e9" stroke-width="0.8" opacity="0.3"/>

  <!-- CHEEKBONE lines -->
  <path d="M 97,245 C 120,240 138,238 148,242" fill="none" stroke="#12c2e9" stroke-width="0.7" opacity="0.3"/>
  <path d="M 323,245 C 300,240 282,238 272,242" fill="none" stroke="#12c2e9" stroke-width="0.7" opacity="0.3"/>

  <!-- CIRCUIT — extending from sides and top of head -->
  <g stroke="#12c2e9" fill="none">
    <!-- Left side circuits -->
    <polyline points="95,175 50,175 50,140 10,140" stroke-width="0.8" opacity="0.45"/>
    <polyline points="93,210 45,210 45,230 10,230" stroke-width="0.8" opacity="0.4"/>
    <polyline points="98,250 55,250 55,270 10,270" stroke-width="0.8" opacity="0.38"/>
    <polyline points="105,290 60,290" stroke-width="0.8" opacity="0.35"/>
    <!-- Right side circuits -->
    <polyline points="325,175 370,175 370,140 420,140" stroke-width="0.8" opacity="0.45"/>
    <polyline points="327,210 375,210 375,230 420,230" stroke-width="0.8" opacity="0.4"/>
    <polyline points="322,250 365,250 365,270 420,270" stroke-width="0.8" opacity="0.38"/>
    <polyline points="315,290 360,290" stroke-width="0.8" opacity="0.35"/>
    <!-- Top circuits -->
    <polyline points="180,84 180,50 145,50 145,10" stroke-width="0.8" opacity="0.4"/>
    <polyline points="210,83 210,30" stroke-width="0.8" opacity="0.35"/>
    <polyline points="240,84 240,50 275,50 275,10" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- CIRCUIT NODES -->
  <g filter="url(#glow-lg-v2)">
    <!-- Left nodes -->
    <circle cx="50" cy="175" r="3" fill="#12c2e9"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="45" cy="230" r="3" fill="#12c2e9"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="55" cy="270" r="3" fill="#12c2e9"><animate attributeName="opacity" values="1;0.3;1" dur="1.9s" repeatCount="indefinite"/></circle>
    <!-- Right nodes -->
    <circle cx="370" cy="175" r="3" fill="#12c2e9"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="375" cy="230" r="3" fill="#12c2e9"><animate attributeName="opacity" values="0.8;0.15;0.8" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="365" cy="270" r="3" fill="#12c2e9"><animate attributeName="opacity" values="1;0.3;1" dur="3.0s" repeatCount="indefinite"/></circle>
    <!-- Top nodes -->
    <circle cx="145" cy="50" r="3" fill="#12c2e9"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="275" cy="50" r="3" fill="#12c2e9"><animate attributeName="opacity" values="0.9;0.25;0.9" dur="1.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Purple nodes -->
  <g filter="url(#glow-lg-v2)">
    <circle cx="50" cy="140" r="4.5" fill="#7c3aed"><animate attributeName="opacity" values="1;0.3;1" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="370" cy="140" r="4.5" fill="#7c3aed"><animate attributeName="opacity" values="1;0.25;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="145" cy="10" r="4" fill="#8b5cf6"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="275" cy="10" r="4" fill="#8b5cf6"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="55" cy="250" r="4" fill="#7c3aed"><animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="365" cy="250" r="4" fill="#7c3aed"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Scan line effect -->
  <rect x="95" y="0" width="230" height="640" fill="url(#scan-line)" opacity="0.4">
    <animateTransform attributeName="transform" type="translate" values="0,-640;0,640" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Background particles -->
  <g fill="#12c2e9" opacity="0.25">
    <circle cx="30" cy="60" r="1"/><circle cx="395" cy="80" r="1.2"/>
    <circle cx="15" cy="420" r="1"/><circle cx="408" cy="440" r="0.8"/>
    <circle cx="40" cy="590" r="1.2"/><circle cx="385" cy="580" r="1"/>
  </g>
  <g fill="#8b5cf6" opacity="0.2">
    <circle cx="20" cy="350" r="1.2"/><circle cx="405" cy="370" r="1"/>
    <circle cx="55" cy="530" r="1"/><circle cx="370" cy="520" r="1.2"/>
  </g>
</svg>
